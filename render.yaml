services:
  - type: web
    name: iptv-peru-api
    runtime: rust
    plan: free
    buildCommand: cargo build --release
    startCommand: ./target/release/iptv-peru-api
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: "8000"
      - key: CORS_ORIGINS
        value: "*"
